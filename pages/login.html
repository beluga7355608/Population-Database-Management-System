<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>登录 - 人口数据库管理系统</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        body {
            background: linear-gradient(135deg, #1a3a5c 0%, #2b5a8a 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
    </style>
</head>
<body>
<div class="w-full max-w-md p-8 bg-white rounded-xl shadow-2xl">
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
<iconify-icon class="text-4xl text-blue-800" icon="mdi:shield-account"></iconify-icon>
</div>
<h1 class="text-2xl font-bold text-gray-800">人口数据库管理系统</h1>
<p class="text-gray-500 mt-2">Population Database Management System</p>
</div>
<form class="space-y-6" id="loginForm" onsubmit="handleLogin(event)">
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">账号</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<iconify-icon icon="mdi:account"></iconify-icon>
</span>
<input class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" id="username" placeholder="请输入账号" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
<iconify-icon icon="mdi:lock"></iconify-icon>
</span>
<input class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" id="password" placeholder="请输入密码" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-gray-900" for="remember-me">记住登录状态</label>
</div>
<div class="text-sm">
<a class="font-medium text-blue-600 hover:text-blue-500" href="#">忘记密码？</a>
</div>
</div>
<div>
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-800 hover:bg-blue-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors" type="submit">
                    登 录
                </button>
</div>
</form>
<div class="mt-6 pt-4 border-t border-gray-100">
<p class="text-xs text-gray-400 text-center mb-3">快速演示账号（点击登录）</p>
<div class="grid grid-cols-2 gap-2">
<button class="text-left px-3 py-2 bg-red-50 hover:bg-red-100 rounded-md text-xs transition-colors" onclick="quickLogin('admin','admin123','super_admin')">
<span class="font-bold text-red-700 block">超级管理员</span>
<span class="text-gray-400">admin / admin123</span>
</button>
<button class="text-left px-3 py-2 bg-blue-50 hover:bg-blue-100 rounded-md text-xs transition-colors" onclick="quickLogin('officer','officer123','police_officer')">
<span class="font-bold text-blue-700 block">户籍民警</span>
<span class="text-gray-400">officer / officer123</span>
</button>
<button class="text-left px-3 py-2 bg-green-50 hover:bg-green-100 rounded-md text-xs transition-colors" onclick="quickLogin('auditor','auditor123','auditor')">
<span class="font-bold text-green-700 block">审核员</span>
<span class="text-gray-400">auditor / auditor123</span>
</button>
<button class="text-left px-3 py-2 bg-gray-50 hover:bg-gray-100 rounded-md text-xs transition-colors" onclick="quickLogin('viewer','viewer123','viewer')">
<span class="font-bold text-gray-700 block">普通查询员</span>
<span class="text-gray-400">viewer / viewer123</span>
</button>
</div>
</div>
<div class="mt-8 pt-6 border-t border-gray-100 text-center">
<p class="text-xs text-gray-400">&copy; 2026 东软集团IT人才实训中心 版权所有</p>
</div>
</div>
<script>
    // 预设账号和角色映射
    const ACCOUNTS = {
        'admin':   { password: 'admin123',   role: 'super_admin',    name: '系统管理员' },
        'officer': { password: 'officer123', role: 'police_officer', name: '张民警' },
        'auditor': { password: 'auditor123', role: 'auditor',        name: '王审计' },
        'viewer':  { password: 'viewer123',  role: 'viewer',         name: '李查询' },
    };

    function quickLogin(user, pass, role) {
        document.getElementById('username').value = user;
        document.getElementById('password').value = pass;
        doLogin(user, pass);
    }

    function handleLogin(event) {
        event.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;
        if (!user || !pass) { alert('账号/密码不能为空'); return; }
        doLogin(user, pass);
    }

    function doLogin(user, pass) {
        const acct = ACCOUNTS[user];
        if (!acct) { alert('账号不存在，请检查后重试'); return; }
        if (acct.password !== pass) { alert('密码错误，请重试'); return; }

        // 存储登录信息到 sessionStorage
        sessionStorage.setItem('userRole', acct.role);
        sessionStorage.setItem('userName', acct.name);
        sessionStorage.setItem('username', user);
        sessionStorage.setItem('loginTime', new Date().toISOString());

        window.location.href = 'index.html';
    }
</script>
</body>
</html>
